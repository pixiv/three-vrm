version: 2

updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    time: "09:00"
    timezone: Asia/Tokyo
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    time: "09:00"
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  allow:
  - dependency-type: direct
